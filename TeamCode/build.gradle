apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
}

// Collects every "// TODO(step): ..." comment in TeamCode into TODO_LIST.md at the
// repo root, sorted by step, each linked to its line. Runs before every build.
// Step numbers match the sections of TUNING_GUIDE.md.
// A comment with TODO in it that doesn't match the format (like "// TODO: x" or
// "// TODO(5) x") is left out of the list and gets a warning. It never fails the build.
tasks.register('todoList') {
    def sourceDir = file('src/main/java')
    def output = rootProject.file('TODO_LIST.md')
    def repoRoot = rootProject.projectDir.toPath()
    def stepNames = [
            1 : 'Wiring and configuration',
            2 : 'Drivetrain and localization',
            3 : 'Storage and rail',
            4 : 'Servos',
            5 : 'Turret',
            6 : 'Shooter',
            7 : 'Shot tables',
            8 : 'Field',
            9 : 'Shooting while moving',
            10: 'Driver feedback and loop time',
            11: 'Before competition',
            12: 'Autonomous',
    ]
    inputs.dir(sourceDir)
    outputs.file(output)
    // Always run (it's fast), so a malformed TODO warns on every build, not just the
    // first build after it was written.
    outputs.upToDateWhen { false }

    doLast {
        def todoPattern = ~/\/\/\s*TODO\((\d+)\):\s*(.*)/
        def anyTodoPattern = ~/\/\/\s*TODO\b/
        def items = []
        sourceDir.eachFileRecurse(groovy.io.FileType.FILES) { source ->
            if (!source.name.endsWith('.java')) return
            def path = repoRoot.relativize(source.toPath()).toString().replace('\\', '/')
            def lines = source.readLines('UTF-8')
            lines.eachWithIndex { line, i ->
                def match = todoPattern.matcher(line)
                if (!match.find()) {
                    if (anyTodoPattern.matcher(line).find()) {
                        logger.warn("todoList: malformed TODO, not in TODO_LIST.md (use // TODO(step): text) at ${path}:${i + 1}: ${line.trim()}")
                    }
                    return
                }
                def code = lines.drop(i + 1).collect { it.trim() }.find {
                    it && !it.startsWith('//') && !it.startsWith('/*') && !it.startsWith('*')
                } ?: ''
                def field = code =~ /static\s+(?:final\s+)?\S+\s+(\w+)\s*=/
                def method = code =~ /(\w+)\s*\(/
                def subject = field.find() ? field.group(1) : (method.find() ? method.group(1) + '()' : '')
                items << [
                        step   : match.group(1) as int,
                        text   : match.group(2).trim(),
                        file   : source.name,
                        path   : path,
                        line   : i + 1,
                        subject: subject,
                ]
            }
        }

        def out = new StringBuilder()
        out << '# TODO list\n\n'
        out << 'Generated from the `// TODO(step): ...` comments in TeamCode. Don\'t edit this file. '
        out << 'Do the item, delete its TODO comment, and the list updates on the next build '
        out << '(or run `./gradlew todoList`). How to do each step is in TUNING_GUIDE.md.\n\n'
        out << "**${items.size()} left.**\n"
        items.sort { a, b -> a.step <=> b.step ?: a.path <=> b.path ?: a.line <=> b.line }
                .groupBy { it.step }
                .each { step, stepItems ->
                    out << "\n## ${step}. ${stepNames[step] ?: 'Other'}\n\n"
                    stepItems.each { item ->
                        def subject = item.subject ? " `${item.subject}`" : ''
                        out << "- [ ] [${item.file}:${item.line}](${item.path}#L${item.line})${subject}: ${item.text}\n"
                    }
                }
        // Compare with line endings normalized. Git on Windows may check the file out
        // with CRLF, and rewriting it with LF would show it as modified for no reason.
        def newText = out.toString()
        def oldText = output.exists() ? output.getText('UTF-8').replace('\r\n', '\n') : null
        if (newText != oldText) {
            output.write(newText, 'UTF-8')
        }
    }
}

tasks.named('preBuild') { dependsOn 'todoList' }
